[project]
name = "compotime"
version = "0.3.0"
description = "A library for forecasting compositional time series"
authors = [
    { name = "Jaume Mateu" },
    { name = "Eduard Serrahima" },
]
requires-python = ">=3.9,<3.12"
readme = "README.md"
maintainers = [{ name = "Jaume Mateu" }]
dependencies = [
    "numba>=0.60.0",
    "numpy>=1.25.1,<2",
    "pandas>=2.0.2,<3",
    "scipy>=1.10.1,<2",
    "typing-extensions>=4.6.3,<5",
]

[project.urls]
Documentation = "https://mateuja.github.io/compotime/"

[dependency-groups]
dev = [
    "black[jupyter]>=23.7.0,<24",
    "docformatter>=1.7.5,<2",
    "hypothesis>=6.82.0,<7",
    "ipython>=8.14.0,<9",
    "isort>=5.12.0,<6",
    "jupyterlab>=4.0.3,<5",
    "matplotlib>=3.7.1,<4",
    "pre-commit>=3.3.2,<4",
    "pytest>=7.4.0,<8",
    "pytest-cov>=4.1.0,<5",
    "pytest-xdist>=3.3.1,<4",
    "ruff>=0.0.278,<0.0.291",
]
docs = [
    "nbsphinx>=0.9.2,<0.10",
    "pydata-sphinx-theme>=0.13.3,<0.14",
    "sphinx>=7.0.1,<8",
    "sphinx-gallery>=0.13,<0.15",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
select = [
    "F", "E", "W", "I", "N", "D", "UP", "YTT", "ANN", "S", "BLE", "FBT", "B", "A", "COM", 
    "C4", "DTZ", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE",
    "RET", "SLF", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY",
    "RUF"
]
ignore = ["ANN101", "ANN102", "S101", "D203", "D213", "TRY003"]
cache-dir = ".ruff_cache"
target-version = "py39"

[tool.ruff.pylint]

[tool.ruff.pydocstyle]
convention = "numpy"

[tool.ruff.pep8-naming]
ignore-names = ["F", "X_last", "X_prev", "X_zero"]

[tool.ruff.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["ANN201", "SLF001", "EXE002"]
"compotime/*.py" = ["EXE002"]

[tool.black]
line-length = 100
target-version = ["py39"]


